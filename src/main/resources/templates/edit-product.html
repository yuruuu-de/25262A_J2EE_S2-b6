<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="col-md-6 offset-md-3 shadow p-4 rounded bg-white">
    <h3 class="text-center mb-4">Edit Product</h3>
    <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post">
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Image URL:</label>
            <input type="text" th:field="*{image}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Price:</label>
            <input type="number" th:field="*{price}" class="form-control" step="0.01">
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Category Name:</label>
            <input type="text" th:field="*{categoryName}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}"></div>
        </div>
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-4">Update</button>
            <a th:href="@{/products}" class="btn btn-link">Back to list</a>
        </div>
    </form>
</div>
</body>
</html>
